{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>{{ 'Edit' if grant.id else 'New' }} grant</h1>
  <form method="post" action="{{ action }}" class="grid2">
    <label>Name * <input name="name" value="{{ grant.name or '' }}" required></label>
    <label>Funder <input name="funder" value="{{ grant.funder or '' }}"></label>
    <label class="span2">Scope <textarea name="scope" rows="2">{{ grant.scope or '' }}</textarea></label>
    <label>Max amount <input name="max_amount" value="{{ grant.max_amount or '' }}"></label>
    <label>Duration (months) <input name="duration_months" value="{{ grant.duration_months or '' }}"></label>
    <label>Deadline (text) <input name="deadline" value="{{ grant.deadline or '' }}" placeholder="Rolling, 1 Oct 2026…"></label>
    <label>Deadline (date) <input name="deadline_date" type="date" value="{{ grant.deadline_date or '' }}"></label>
    <label class="span2">Recurrence <input name="deadline_logic" value="{{ grant.deadline_logic or '' }}" placeholder="annual, usually October"></label>
    <label class="span2">Link <input name="link" value="{{ grant.link or '' }}"></label>
    <label class="span2">Notes <textarea name="notes" rows="2">{{ grant.notes or '' }}</textarea></label>
    <label>Grant start <input name="grant_start" value="{{ grant.grant_start or '' }}"></label>
    <label>Type
      <select name="primary_type">
        <option value=""></option>
        {% for t in ['Project','Postdoc','PI','Network','PhD','Other'] %}
        <option value="{{ t }}" {% if grant.primary_type == t %}selected{% endif %}>{{ t }}</option>{% endfor %}
      </select>
    </label>
    <label>Status
      <select name="status">
        {% for s in ['open','closed','archived'] %}<option value="{{ s }}" {% if (grant.status or 'open') == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
      </select>
    </label>
    <div class="span2 actions">
      <button type="submit">Save</button>
      <a class="btn muted" href="/grants">Cancel</a>
    </div>
  </form>
  {% if grant.id %}
  <form method="post" action="/grants/{{ grant.id }}/delete" onsubmit="return confirm('Permanently delete this grant and its proposals?')">
    <button class="danger" type="submit">Delete grant</button>
  </form>
  {% endif %}
</div>
{% endblock %}
